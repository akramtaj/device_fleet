syntax = "proto3";
package fleet;
service DeviceManagement {
  rpc RegisterDevice(RegisterRequest) returns (DeviceResponse);
  rpc InitiateDeviceAction(ActionRequest) returns (ActionResponse);
  rpc GetDeviceActionStatus(ActionStatusRequest) returns (ActionStatusResponse);
}
enum DeviceStatus { IDLE = 0; UPDATING = 1; }
message RegisterRequest { string device_id = 1; }
message DeviceResponse { string device_id = 1; DeviceStatus status = 2; }
message ActionRequest { string device_id = 1; string action_type = 2; }
message ActionResponse { string action_id = 1; }
message ActionStatusRequest { string action_id = 1; }
message ActionStatusResponse { string status = 1; }
